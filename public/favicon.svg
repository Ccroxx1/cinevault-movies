<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Red 3D Gradient -->
    <linearGradient id="fav-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3355" />
      <stop offset="35%" stop-color="#E50914" />
      <stop offset="75%" stop-color="#B30012" />
      <stop offset="100%" stop-color="#550009" />
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="fav-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Dark Chrome Inner Reel -->
    <radialGradient id="fav-silver-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#94A3B8" />
      <stop offset="90%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Film Ribbon Gradient -->
    <linearGradient id="fav-ribbon" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="30%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#E50914" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Base Container with Subtle Glow -->
  <rect width="128" height="128" rx="28" fill="#080808" />
  <circle cx="64" cy="62" r="48" fill="#E50914" opacity="0.18" />

  <g transform="translate(4, 4)">
    <!-- === OUTER METALLIC RED 'C' ARC === -->
    <path
      d="M 68 18 
         C 40 16, 20 34, 20 60 
         C 20 86, 40 102, 68 100 
         C 74 99.5, 78 98, 80 96 
         C 76 92, 70 88, 64 87 
         C 46 86, 33 74, 33 60 
         C 33 46, 46 32, 64 31 
         C 72 30.5, 76 26, 80 22 
         C 76 20, 72 18.5, 68 18 Z"
      fill="url(#fav-red)"
      stroke="#FF5577"
      stroke-width="1.2"
    />

    <!-- 3D Bevel Highlight Edge on 'C' -->
    <path
      d="M 72 19.5 
         C 44 18, 23 35, 23 60 
         C 23 83, 42 98, 66 97"
      fill="none"
      stroke="#FFAAB8"
      stroke-width="1.6"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- === METALLIC RED 'V' WITH FILM SPROCKETS === -->
    <path
      d="M 60 40 L 74 88 L 84 88 L 68 36 Z"
      fill="url(#fav-red)"
      opacity="0.95"
    />
    <path
      d="M 74 88 L 94 30 L 108 30 L 84 88 Z"
      fill="url(#fav-red)"
      stroke="#FF5577"
      stroke-width="1"
    />
    <path
      d="M 94 30 L 108 30 L 84 88"
      fill="none"
      stroke="#FFAAB8"
      stroke-width="1.4"
      opacity="0.85"
    />

    <!-- Film sprocket cutouts in the right arm of 'V' -->
    <g fill="#080808" stroke="#334155" stroke-width="0.5">
      <rect x="94.5" y="36" width="7" height="4.5" rx="1" transform="rotate(-18 94.5 36)" />
      <rect x="90" y="46" width="7" height="4.5" rx="1" transform="rotate(-18 90 46)" />
      <rect x="85.5" y="56" width="7" height="4.5" rx="1" transform="rotate(-18 85.5 56)" />
      <rect x="81" y="66" width="7" height="4.5" rx="1" transform="rotate(-18 81 66)" />
      <rect x="76.5" y="76" width="7" height="4.5" rx="1" transform="rotate(-18 76.5 76)" />
    </g>

    <!-- === 35MM CELLULOID FILM RIBBON ROLLING FORWARD === -->
    <path
      d="M 45 68 
         C 55 76, 68 84, 88 84 
         L 84 94 
         C 62 94, 48 86, 38 76 Z"
      fill="url(#fav-ribbon)"
      stroke="#64748B"
      stroke-width="0.8"
    />
    <g fill="#050505">
      <rect x="44" y="72" width="2.5" height="3" rx="0.5" transform="rotate(20 44 72)" />
      <rect x="52" y="76" width="2.5" height="3" rx="0.5" transform="rotate(15 52 76)" />
      <rect x="61" y="79" width="2.5" height="3" rx="0.5" transform="rotate(10 61 79)" />
      <rect x="71" y="81" width="2.5" height="3" rx="0.5" transform="rotate(5 71 81)" />
      <rect x="80" y="82" width="2.5" height="3" rx="0.5" transform="rotate(0 80 82)" />
      <rect x="42" y="78" width="2.5" height="3" rx="0.5" transform="rotate(20 42 78)" />
      <rect x="50" y="82" width="2.5" height="3" rx="0.5" transform="rotate(15 50 82)" />
      <rect x="59" y="85" width="2.5" height="3" rx="0.5" transform="rotate(10 59 85)" />
      <rect x="69" y="87" width="2.5" height="3" rx="0.5" transform="rotate(5 69 87)" />
      <rect x="78" y="88" width="2.5" height="3" rx="0.5" transform="rotate(0 78 88)" />
    </g>
    <line x1="56" y1="75" x2="54" y2="86" stroke="#94A3B8" stroke-width="0.8" opacity="0.6" />
    <line x1="66" y1="78" x2="65" y2="89" stroke="#94A3B8" stroke-width="0.8" opacity="0.6" />
    <line x1="76" y1="80" x2="75" y2="91" stroke="#94A3B8" stroke-width="0.8" opacity="0.6" />

    <!-- === CHROME METALLIC 6-HOLE FILM REEL === -->
    <g filter="url(#fav-glow)">
      <!-- Outer Reel Ring -->
      <circle
        cx="52"
        cy="50"
        r="23"
        fill="url(#fav-silver)"
        stroke="#FFFFFF"
        stroke-width="1.4"
      />

      <!-- Inner Groove Ring -->
      <circle
        cx="52"
        cy="50"
        r="20"
        fill="url(#fav-silver-inner)"
        stroke="#475569"
        stroke-width="0.8"
      />

      <!-- 6 Circular Cutouts in Reel -->
      <circle cx="52" cy="37" r="4.2" fill="#0A0A0A" stroke="#CBD5E1" stroke-width="0.8" />
      <circle cx="63" cy="43.5" r="4.2" fill="#0A0A0A" stroke="#CBD5E1" stroke-width="0.8" />
      <circle cx="63" cy="56.5" r="4.2" fill="#0A0A0A" stroke="#CBD5E1" stroke-width="0.8" />
      <circle cx="52" cy="63" r="4.2" fill="#0A0A0A" stroke="#CBD5E1" stroke-width="0.8" />
      <circle cx="41" cy="56.5" r="4.2" fill="#0A0A0A" stroke="#CBD5E1" stroke-width="0.8" />
      <circle cx="41" cy="43.5" r="4.2" fill="#0A0A0A" stroke="#CBD5E1" stroke-width="0.8" />

      <!-- Central Chrome Spindle Hub -->
      <circle cx="52" cy="50" r="6" fill="url(#fav-silver)" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="52" cy="50" r="2.4" fill="#0A0A0A" stroke="#94A3B8" stroke-width="0.6" />

      <!-- 5 Tiny Perforation Dots Around Center -->
      <circle cx="52" cy="46" r="0.8" fill="#0A0A0A" />
      <circle cx="55.8" cy="48.8" r="0.8" fill="#0A0A0A" />
      <circle cx="54.4" cy="53" r="0.8" fill="#0A0A0A" />
      <circle cx="49.6" cy="53" r="0.8" fill="#0A0A0A" />
      <circle cx="48.2" cy="48.8" r="0.8" fill="#0A0A0A" />

      <!-- Top-left Gloss Glare on Reel -->
      <path
        d="M 37 38 C 42 32, 52 30, 62 34 C 54 33, 44 36, 37 38 Z"
        fill="#FFFFFF"
        opacity="0.85"
      />
    </g>
  </g>
</svg>
