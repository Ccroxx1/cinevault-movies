    <!-- Early Third-Party Extension Error Interceptor -->
    <script>
      (function() {
        function isIgnoredError(msg, src) {
          var str = (String(msg || '') + ' ' + String(src || '')).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('solana') !== -1 ||
            str.indexOf('phantom') !== -1 ||
            str.indexOf('coinbase') !== -1 ||
            str.indexOf('web3') !== -1 ||
            str.indexOf('failed to connect to metamask') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('safari-web-extension://') !== -1
          );
        }

        // Intercept standard window error event (capture phase)
        window.addEventListener('error', function(e) {
          var msg = e.message || (e.error && e.error.message) || '';
          var file = e.filename || '';
          if (isIgnoredError(msg, file)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Intercept unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = typeof reason === 'string' ? reason : (reason && (reason.message || reason.stack)) || '';
          if (isIgnoredError(msg, '')) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Intercept console.error from injected scripts
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch(e) { return String(a); }
          }).join(' ');
          if (isIgnoredError(joined, '')) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var joined = args.map(function(a) {
            try { return typeof a === 'object' ? JSON.stringify(a) : String(a); } catch(e) { return String(a); }
          }).join(' ');
          if (isIgnoredError(joined, '')) {
            return;
          }
          origConsoleWarn.apply(console, arguments);
        };
      })();
    </script>
