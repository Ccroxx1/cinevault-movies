    <!-- 2. Conditional CookieHub Consent & Theme Initialization -->
    <script>
      (function() {
        var host = window.location.hostname.toLowerCase();
        var isProd = host === 'cinevaultmovies.online' || host.endsWith('.cinevaultmovies.online') || host === 'moviesandseries.xyz' || host.endsWith('.moviesandseries.xyz');

        // Sync CookieHub decisions into first-party consent state without blocking app render
        var syncConsentState = function(isInit) {
          try {
            if (window.cookiehub && typeof window.cookiehub.hasConsented === 'function') {
              var allowed = Boolean(window.cookiehub.hasConsented('marketing'));
              if (isInit && !allowed) return;
              localStorage.setItem('cinevault_cookie_consent', allowed ? 'accepted' : 'essential_only');
              window.dispatchEvent(new CustomEvent('cinevault_consent_changed', { detail: { accepted: allowed } }));
            }
          } catch(e) {}
        };

        // Initialize CookieHub CMP only on production domain
        if (isProd) {
          try {
            var ch = document.createElement('script');
            ch.async = true;
            ch.src = 'https://cdn.cookiehub.eu/c2/b3cbcdd6.js';
            ch.onerror = function() {
              // Blocked by tracking prevention or ad blocker — first-party CookieConsentBanner handles consent
            };
            ch.onload = function() {
              if (window.cookiehub && typeof window.cookiehub.load === 'function') {
                window.cookiehub.load({
                  onInitialise: function() { syncConsentState(true); },
                  onAllow: function() { syncConsentState(false); },
                  onRevoke: function() { syncConsentState(false); }
                });
              }
            };
            document.head.appendChild(ch);
          } catch(e) {}
        }

        // Clear legacy Service Workers or stale precached shells in preview/sandbox environments
        try {
          if ('serviceWorker' in navigator && !isProd) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var j = 0; j < keys.length; j++) caches.delete(keys[j]);
              });
            }
          }
        } catch(e) {}

        // Theme Initialization
        try {
          var mode = localStorage.getItem('cinevault_color_mode') || 'black';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.classList.remove('dark', 'light', 'theme-black', 'theme-white', 'theme-blue-black');
          if (mode === 'white') {
            document.documentElement.classList.add('light', 'theme-white');
          } else if (mode === 'blue-black') {
            document.documentElement.classList.add('dark', 'theme-blue-black');
          } else {
            document.documentElement.classList.add('dark', 'theme-black');
          }
        } catch(e) {}
      })();
    </script>
