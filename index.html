    <script>
      (function() {
        // Suppress expected benign dev websocket connection notices in AI Studio container environment
        try {
          var origError = console.error;
          console.error = function() {
            var firstArg = arguments[0];
            var str = typeof firstArg === 'string' ? firstArg : (firstArg && firstArg.message ? firstArg.message : '');
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf('vite-plugin-pwa') !== -1
            ) {
              return;
            }
            origError.apply(console, arguments);
          };
        } catch (e) {}

        try {
          var mode = localStorage.getItem('cinevault_color_mode') || 'black';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.classList.remove('dark', 'light', 'theme-black', 'theme-white', 'theme-blue-black');
          if (mode === 'white') {
            document.documentElement.classList.add('light', 'theme-white');
          } else if (mode === 'blue-black') {
            document.documentElement.classList.add('dark', 'theme-blue-black');
          } else {
            document.documentElement.classList.add('dark', 'theme-black');
          }
        } catch(e) {}
      })();
    </script>
