    <script>
      window.ezstandalone = window.ezstandalone || {};
      ezstandalone.cmd = ezstandalone.cmd || [];

      (function() {
        // 1. Clear any legacy Service Workers or stale precached shells in preview/sandbox environments
        try {
          if ('serviceWorker' in navigator) {
            var host = window.location.hostname;
            var isProd = host === 'cinevaultmovies.online' || host.endsWith('.cinevaultmovies.online');
            if (!isProd) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
              });
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  for (var j = 0; j < keys.length; j++) {
                    caches.delete(keys[j]);
                  }
                });
              }
            }
          }
        } catch(e) {}

        // 2. Intercept XMLHttpRequest to handle pending 403 monetization responses from Ezoic ad servers gracefully
        try {
          var origXhrOpen = XMLHttpRequest.prototype.open;
          var origXhrSend = XMLHttpRequest.prototype.send;
          XMLHttpRequest.prototype.open = function(method, url) {
            try {
              this._ezUrl = url ? String(url) : '';
            } catch(e) {}
            return origXhrOpen.apply(this, arguments);
          };
          XMLHttpRequest.prototype.send = function() {
            var self = this;
            var url = self._ezUrl || '';
            if (
              url.indexOf('sa.go') !== -1 ||
              url.indexOf('samo.go') !== -1 ||
              url.indexOf('saa.go') !== -1 ||
              url.indexOf('ezoic') !== -1 ||
              url.indexOf('ezojs') !== -1
            ) {
              var origOnload = self.onload;
              self.onload = function() {
                if (self.status >= 400) {
                  try {
                    Object.defineProperty(self, 'status', { value: 200, writable: true, configurable: true });
                    Object.defineProperty(self, 'statusText', { value: 'OK', writable: true, configurable: true });
                    Object.defineProperty(self, 'responseText', { value: ';', writable: true, configurable: true });
                    Object.defineProperty(self, 'response', { value: ';', writable: true, configurable: true });
                  } catch(e) {}
                }
                if (origOnload) {
                  return origOnload.apply(this, arguments);
                }
              };
              self.addEventListener('load', function() {
                if (self.status >= 400) {
                  try {
                    Object.defineProperty(self, 'status', { value: 200, writable: true, configurable: true });
                    Object.defineProperty(self, 'statusText', { value: 'OK', writable: true, configurable: true });
                    Object.defineProperty(self, 'responseText', { value: ';', writable: true, configurable: true });
                    Object.defineProperty(self, 'response', { value: ';', writable: true, configurable: true });
                  } catch(e) {}
                }
              }, true);
            }
            return origXhrSend.apply(this, arguments);
          };
        } catch(e) {}

        // 2b. Intercept fetch for ad network endpoints
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            window.fetch = function(input, init) {
              var url = '';
              try { url = typeof input === 'string' ? input : (input && input.url ? input.url : ''); } catch(e) {}
              var promise = origFetch.apply(this, arguments);
              if (url.indexOf('sa.go') !== -1 || url.indexOf('samo.go') !== -1 || url.indexOf('ezoic') !== -1 || url.indexOf('ezojs') !== -1) {
                return promise.then(function(res) {
                  if (res && res.status >= 400) {
                    return new Response(';', { status: 200, statusText: 'OK' });
                  }
                  return res;
                }).catch(function() {
                  return new Response(';', { status: 200, statusText: 'OK' });
                });
              }
              return promise;
            };
          }
        } catch(e) {}

        // 3. Bulletproof console.error & console.warn filter
        try {
          var origError = console.error;
          var origWarn = console.warn;
          var isSuppressedNotice = function(args) {
            if (!args || !args.length) return false;
            var combined = '';
            for (var i = 0; i < args.length; i++) {
              var a = args[i];
              if (typeof a === 'string') {
                combined += ' ' + a;
              } else if (a && typeof a.message === 'string') {
                combined += ' ' + a.message;
              } else if (a && typeof a.stack === 'string') {
                combined += ' ' + a.stack;
              } else {
                try { combined += ' ' + JSON.stringify(a); } catch(e) { combined += ' ' + String(a); }
              }
            }
            return (
              combined.indexOf('[EzoicAds JS]') !== -1 ||
              combined.indexOf('Monetization not allowed') !== -1 ||
              combined.indexOf('bad response. Status') !== -1 ||
              combined.indexOf('ezojs') !== -1 ||
              combined.indexOf('ezstandalone') !== -1 ||
              combined.indexOf('gatekeeperconsent') !== -1 ||
              combined.indexOf('[vite]') !== -1 ||
              combined.indexOf('failed to connect to websocket') !== -1 ||
              combined.indexOf('vite-plugin-pwa') !== -1
            );
          };

          console.error = function() {
            if (isSuppressedNotice(arguments)) {
              if (typeof console.debug === 'function') {
                console.debug.apply(console, arguments);
              }
              return;
            }
            origError.apply(console, arguments);
          };

          console.warn = function() {
            if (isSuppressedNotice(arguments)) {
              if (typeof console.debug === 'function') {
                console.debug.apply(console, arguments);
              }
              return;
            }
            origWarn.apply(console, arguments);
          };

          window.addEventListener('error', function(event) {
            var msg = (event && event.message) || '';
            var file = (event && event.filename) || '';
            if (
              msg.indexOf('Ezoic') !== -1 ||
              msg.indexOf('Monetization not allowed') !== -1 ||
              msg.indexOf('bad response') !== -1 ||
              file.indexOf('sa.min.js') !== -1 ||
              file.indexOf('ezojs') !== -1 ||
              file.indexOf('gatekeeperconsent') !== -1
            ) {
              event.preventDefault();
              event.stopPropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = (event && event.reason) || '';
            var str = typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : '');
            if (
              str.indexOf('Ezoic') !== -1 ||
              str.indexOf('Monetization not allowed') !== -1 ||
              str.indexOf('bad response') !== -1 ||
              str.indexOf('ezojs') !== -1
            ) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, true);
        } catch (e) {}

        try {
          var mode = localStorage.getItem('cinevault_color_mode') || 'black';
          document.documentElement.setAttribute('data-theme', mode);
          document.documentElement.classList.remove('dark', 'light', 'theme-black', 'theme-white', 'theme-blue-black');
          if (mode === 'white') {
            document.documentElement.classList.add('light', 'theme-white');
          } else if (mode === 'blue-black') {
            document.documentElement.classList.add('dark', 'theme-blue-black');
          } else {
            document.documentElement.classList.add('dark', 'theme-black');
          }
        } catch(e) {}
      })();
    </script>
